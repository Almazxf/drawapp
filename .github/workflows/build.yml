name: Build DrawApp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - name: List dist
        run: dir dist
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DrawApp-portable
          path: dist/
