<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrawApp</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@300;400;600&display=swap');

  :root {
    --bg: #0f0f17;
    --surface: #16161f;
    --surface2: #1e1e2e;
    --surface3: #252535;
    --border: #2e2e45;
    --accent: #7c6af7;
    --accent2: #56cfb2;
    --accent3: #f7a06a;
    --text: #e2e2f0;
    --text2: #8888aa;
    --text3: #555570;
    --danger: #f06a7a;
    --selection: rgba(124,106,247,0.25);
    --handle: #7c6af7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── TOP BAR ── */
  #topbar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 4px;
    flex-shrink: 0;
    z-index: 100;
  }

  #logo {
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
    margin-right: 12px;
    padding-right: 12px;
    border-right: 1px solid var(--border);
  }

  .tb-btn {
    height: 32px;
    padding: 0 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tb-btn:hover { background: var(--surface3); border-color: var(--border); color: var(--text); }
  .tb-btn.active { background: var(--surface3); border-color: var(--accent); color: var(--accent); }
  .tb-btn svg { flex-shrink: 0; }

  .tb-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  #tb-zoom {
    font-size: 11px;
    color: var(--text2);
    min-width: 48px;
    text-align: center;
    margin-left: 4px;
  }

  /* ── MAIN LAYOUT ── */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── LEFT TOOLBAR ── */
  #toolbar {
    width: 56px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 2px;
    flex-shrink: 0;
  }

  .tool-btn {
    width: 40px;
    height: 40px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    transition: all 0.15s;
    position: relative;
  }
  .tool-btn:hover { background: var(--surface3); color: var(--text); }
  .tool-btn.active { background: rgba(124,106,247,0.15); border-color: var(--accent); color: var(--accent); }
  .tool-btn .tooltip {
    position: absolute;
    left: 48px;
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 999;
  }
  .tool-btn:hover .tooltip { opacity: 1; }

  .tool-sep { width: 30px; height: 1px; background: var(--border); margin: 4px 0; }

  /* ── CANVAS AREA ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,106,247,0.04) 0%, transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(86,207,178,0.03) 0%, transparent 60%),
      var(--bg);
  }

  #canvas-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  #canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    cursor: default;
  }

  /* ── RIGHT PANEL ── */
  #rightpanel {
    width: 220px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .panel-section {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .prop-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }
  .prop-label { font-size: 10px; color: var(--text2); flex-shrink: 0; }

  .prop-input {
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 4px 6px;
    width: 70px;
    outline: none;
    transition: border-color 0.15s;
  }
  .prop-input:focus { border-color: var(--accent); }

  .color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .color-swatch {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    border: 1px solid var(--border);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .color-swatch input[type=color] {
    position: absolute;
    inset: -4px;
    width: 140%;
    height: 140%;
    opacity: 0;
    cursor: pointer;
  }
  .color-label { font-size: 10px; color: var(--text2); }
  .color-hex {
    font-size: 10px;
    color: var(--text);
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font-family: 'JetBrains Mono', monospace;
    flex: 1;
    min-width: 0;
    outline: none;
  }
  .color-hex:focus { border-color: var(--accent); }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .checkbox-row input { accent-color: var(--accent); cursor: pointer; }
  .checkbox-row span { font-size: 10px; color: var(--text2); }

  .slider-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 8px;
  }
  .slider-row .prop-label { margin-bottom: 4px; }
  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    height: 4px;
    cursor: pointer;
  }

  .text-area {
    width: 100%;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 8px;
    resize: vertical;
    outline: none;
    min-height: 60px;
    transition: border-color 0.15s;
  }
  .text-area:focus { border-color: var(--accent); }

  .font-size-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }

  /* stroke width buttons */
  .stroke-btns {
    display: flex;
    gap: 4px;
  }
  .stroke-btn {
    width: 28px;
    height: 28px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .stroke-btn.active { border-color: var(--accent); background: rgba(124,106,247,0.15); }
  .stroke-btn:hover { border-color: var(--text3); }

  /* delete btn */
  .delete-btn {
    width: 100%;
    height: 32px;
    background: rgba(240,106,122,0.1);
    border: 1px solid rgba(240,106,122,0.3);
    border-radius: 6px;
    color: var(--danger);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .delete-btn:hover { background: rgba(240,106,122,0.2); border-color: var(--danger); }

  /* no-selection state */
  #no-selection {
    padding: 20px 12px;
    text-align: center;
    color: var(--text3);
    font-size: 10px;
    line-height: 1.6;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* status bar */
  #statusbar {
    height: 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 16px;
    font-size: 9px;
    color: var(--text3);
    flex-shrink: 0;
  }
  #statusbar span { letter-spacing: 0.5px; }

  /* inline text editor overlay */
  #text-editor {
    position: fixed;
    display: none;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    color: #ffffff;
    resize: none;
    overflow: hidden;
    z-index: 1000;
    min-width: 60px;
    min-height: 20px;
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div id="logo">DRAW</div>
  <button class="tb-btn" onclick="newProject()" title="Новый проект">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Новый
  </button>
  <button class="tb-btn" onclick="openProject()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    Открыть
  </button>
  <button class="tb-btn" onclick="saveProject()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Сохранить
  </button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="undo()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    Undo
  </button>
  <button class="tb-btn" onclick="redo()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 0 4-4h12"/></svg>
    Redo
  </button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="zoomOut()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
  </button>
  <div id="tb-zoom">100%</div>
  <button class="tb-btn" onclick="zoomIn()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
  </button>
  <button class="tb-btn" onclick="resetZoom()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Сброс
  </button>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT TOOLBAR -->
  <div id="toolbar">
    <button class="tool-btn active" id="tool-select" onclick="setTool('select')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l7 18 3-7 7-3z"/></svg>
      <span class="tooltip">Выбор (V)</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="tool-rect" onclick="setTool('rect')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/></svg>
      <span class="tooltip">Квадрат/Прямоугольник (R)</span>
    </button>
    <button class="tool-btn" id="tool-circle" onclick="setTool('circle')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
      <span class="tooltip">Круг (C)</span>
    </button>
    <button class="tool-btn" id="tool-ellipse" onclick="setTool('ellipse')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="10" ry="6"/></svg>
      <span class="tooltip">Овал (E)</span>
    </button>
    <button class="tool-btn" id="tool-triangle" onclick="setTool('triangle')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,3 21,21 3,21"/></svg>
      <span class="tooltip">Треугольник (T)</span>
    </button>
    <button class="tool-btn" id="tool-diamond" onclick="setTool('diamond')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 22,12 12,22 2,12"/></svg>
      <span class="tooltip">Ромб (D)</span>
    </button>
    <button class="tool-btn" id="tool-star" onclick="setTool('star')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
      <span class="tooltip">Звезда (S)</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="tool-line" onclick="setTool('line')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
      <span class="tooltip">Линия (L)</span>
    </button>
    <button class="tool-btn" id="tool-arrow" onclick="setTool('arrow')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="10,5 19,5 19,14"/></svg>
      <span class="tooltip">Стрелка (A)</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="tool-text" onclick="setTool('text')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      <span class="tooltip">Текст (X)</span>
    </button>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <canvas id="canvas-bg"></canvas>
    <canvas id="canvas"></canvas>
  </div>

  <!-- RIGHT PANEL -->
  <div id="rightpanel">
    <div id="no-selection" class="panel-section">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text3);margin:0 auto 8px;display:block"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
      Выберите объект<br>для редактирования
    </div>

    <div id="props-panel" style="display:none">
      <!-- Transform -->
      <div class="panel-section">
        <div class="panel-title">Позиция и размер</div>
        <div class="prop-row">
          <span class="prop-label">X</span>
          <input class="prop-input" id="prop-x" type="number" oninput="updatePropXY()">
        </div>
        <div class="prop-row">
          <span class="prop-label">Y</span>
          <input class="prop-input" id="prop-y" type="number" oninput="updatePropXY()">
        </div>
        <div class="prop-row">
          <span class="prop-label">W</span>
          <input class="prop-input" id="prop-w" type="number" oninput="updatePropWH()">
        </div>
        <div class="prop-row">
          <span class="prop-label">H</span>
          <input class="prop-input" id="prop-h" type="number" oninput="updatePropWH()">
        </div>
      </div>

      <!-- Fill -->
      <div class="panel-section" id="fill-section">
        <div class="panel-title">Заливка</div>
        <div class="checkbox-row">
          <input type="checkbox" id="fill-enabled" onchange="updateFill()">
          <span>Включить заливку</span>
        </div>
        <div class="color-row">
          <div class="color-swatch" id="fill-swatch">
            <input type="color" id="fill-color" value="#7c6af7" oninput="syncFillColor(this.value)">
          </div>
          <span class="color-label">Цвет</span>
          <input class="color-hex" id="fill-hex" maxlength="7" value="#7c6af7" oninput="syncFillHex(this.value)">
        </div>
        <div class="slider-row">
          <span class="prop-label">Прозрачность: <span id="fill-opacity-val">100</span>%</span>
          <input type="range" id="fill-opacity" min="0" max="100" value="100" oninput="updateFillOpacity(this.value)">
        </div>
      </div>

      <!-- Stroke -->
      <div class="panel-section" id="stroke-section">
        <div class="panel-title">Обводка</div>
        <div class="color-row">
          <div class="color-swatch" id="stroke-swatch">
            <input type="color" id="stroke-color" value="#7c6af7" oninput="syncStrokeColor(this.value)">
          </div>
          <span class="color-label">Цвет</span>
          <input class="color-hex" id="stroke-hex" maxlength="7" value="#7c6af7" oninput="syncStrokeHex(this.value)">
        </div>
        <div class="prop-label" style="margin-bottom:6px">Толщина</div>
        <div class="stroke-btns">
          <button class="stroke-btn active" data-w="1" onclick="setStrokeWidth(1)"><svg width="14" height="14"><line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="1"/></svg></button>
          <button class="stroke-btn" data-w="2" onclick="setStrokeWidth(2)"><svg width="14" height="14"><line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="2"/></svg></button>
          <button class="stroke-btn" data-w="4" onclick="setStrokeWidth(4)"><svg width="14" height="14"><line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="3"/></svg></button>
          <button class="stroke-btn" data-w="8" onclick="setStrokeWidth(8)"><svg width="14" height="14"><line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="5"/></svg></button>
        </div>
      </div>

      <!-- Text -->
      <div class="panel-section" id="text-section">
        <div class="panel-title">Текст</div>
        <textarea class="text-area" id="prop-text" placeholder="Текст..." oninput="updateText()"></textarea>
        <div class="font-size-row">
          <span class="prop-label">Размер:</span>
          <input class="prop-input" id="prop-fontsize" type="number" value="14" min="6" max="128" oninput="updateFontSize()">
          <span class="prop-label">px</span>
        </div>
        <div class="color-row" style="margin-top:8px">
          <div class="color-swatch">
            <input type="color" id="text-color" value="#ffffff" oninput="updateTextColor(this.value)">
          </div>
          <span class="color-label">Цвет текста</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="panel-section">
        <div class="panel-title">Действия</div>
        <button class="delete-btn" onclick="deleteSelected()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Удалить объект
        </button>
      </div>
    </div>
  </div>

</div>

<!-- STATUS BAR -->
<div id="statusbar">
  <span id="st-tool">Инструмент: Выбор</span>
  <span id="st-mouse">0, 0</span>
  <span id="st-objects">Объектов: 0</span>
  <span id="st-hint">V — выбор | R/C/E/T/D/S — фигуры | L/A — линии | X — текст | Delete — удалить</span>
</div>

<textarea id="text-editor"></textarea>

<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const bgCanvas = document.getElementById('canvas-bg');
const bgCtx = bgCanvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

let shapes = [];
let selectedId = null;
let currentTool = 'select';
let zoom = 1;
let panX = 0, panY = 0;
let isDragging = false;
let isDrawing = false;
let isPanning = false;
let dragStart = { x: 0, y: 0 };
let drawStart = { x: 0, y: 0 };
let currentShape = null;
let resizeHandle = null;
let dragShapeStart = null;
let mousePos = { x: 0, y: 0 };

let undoStack = [];
let redoStack = [];

const HANDLE_SIZE = 7;
const ARROW_HEAD = 14;

// Default props
let defaultFill = { enabled: true, color: '#7c6af7', opacity: 80 };
let defaultStroke = { color: '#a09aff', width: 2 };
let defaultText = { content: '', size: 14, color: '#ffffff' };

// ═══════════════════════════════════════════════════════
// INIT / RESIZE
// ═══════════════════════════════════════════════════════
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = w; canvas.height = h;
  bgCanvas.width = w; bgCanvas.height = h;
  drawGrid();
  render();
}

window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════
// GRID
// ═══════════════════════════════════════════════════════
function drawGrid() {
  const w = bgCanvas.width, h = bgCanvas.height;
  bgCtx.clearRect(0, 0, w, h);
  const step = 40 * zoom;
  const ox = (panX % step + step) % step;
  const oy = (panY % step + step) % step;
  bgCtx.strokeStyle = 'rgba(255,255,255,0.035)';
  bgCtx.lineWidth = 1;
  for (let x = ox; x < w; x += step) {
    bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, h); bgCtx.stroke();
  }
  for (let y = oy; y < h; y += step) {
    bgCtx.beginPath(); bgCtx.moveTo(0, y); bgCtx.lineTo(w, y); bgCtx.stroke();
  }
  // Dot at origin
  const ox2 = panX, oy2 = panY;
  if (ox2 >= 0 && ox2 < w && oy2 >= 0 && oy2 < h) {
    bgCtx.fillStyle = 'rgba(124,106,247,0.4)';
    bgCtx.beginPath(); bgCtx.arc(ox2, oy2, 3, 0, Math.PI*2); bgCtx.fill();
  }
}

// ═══════════════════════════════════════════════════════
// COORD TRANSFORM
// ═══════════════════════════════════════════════════════
function screenToWorld(sx, sy) {
  return { x: (sx - panX) / zoom, y: (sy - panY) / zoom };
}
function worldToScreen(wx, wy) {
  return { x: wx * zoom + panX, y: wy * zoom + panY };
}

// ═══════════════════════════════════════════════════════
// SHAPE ID
// ═══════════════════════════════════════════════════════
let nextId = 1;
function uid() { return nextId++; }

// ═══════════════════════════════════════════════════════
// SHAPE FACTORY
// ═══════════════════════════════════════════════════════
function makeShape(type, x, y, w, h) {
  return {
    id: uid(),
    type,
    x, y, w, h,
    fill: { ...defaultFill },
    stroke: { ...defaultStroke },
    text: { ...defaultText }
  };
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function render() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(zoom, zoom);

  for (const s of shapes) {
    drawShape(ctx, s, s.id === selectedId);
  }

  // Preview shape while drawing
  if (isDrawing && currentShape) {
    drawShape(ctx, currentShape, false);
  }

  ctx.restore();
  updateStatusBar();
}

function hexToRgba(hex, opacity) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${opacity/100})`;
}

function drawShape(ctx, s, selected) {
  ctx.save();
  const { x, y, w, h } = s;

  // Setup fill
  if (s.fill.enabled) {
    ctx.fillStyle = hexToRgba(s.fill.color, s.fill.opacity);
  }

  // Setup stroke
  ctx.strokeStyle = s.stroke.color;
  ctx.lineWidth = s.stroke.width / zoom;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // Glow on selection
  if (selected) {
    ctx.shadowColor = 'rgba(124,106,247,0.6)';
    ctx.shadowBlur = 12 / zoom;
  }

  const cx = x + w / 2, cy = y + h / 2;

  switch (s.type) {
    case 'rect': {
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      if (s.fill.enabled) ctx.fill();
      ctx.stroke();
      break;
    }
    case 'circle': {
      const r = Math.min(Math.abs(w), Math.abs(h)) / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      if (s.fill.enabled) ctx.fill();
      ctx.stroke();
      break;
    }
    case 'ellipse': {
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.abs(w)/2, Math.abs(h)/2, 0, 0, Math.PI*2);
      if (s.fill.enabled) ctx.fill();
      ctx.stroke();
      break;
    }
    case 'triangle': {
      ctx.beginPath();
      ctx.moveTo(cx, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.closePath();
      if (s.fill.enabled) ctx.fill();
      ctx.stroke();
      break;
    }
    case 'diamond': {
      ctx.beginPath();
      ctx.moveTo(cx, y);
      ctx.lineTo(x + w, cy);
      ctx.lineTo(cx, y + h);
      ctx.lineTo(x, cy);
      ctx.closePath();
      if (s.fill.enabled) ctx.fill();
      ctx.stroke();
      break;
    }
    case 'star': {
      const outerR = Math.min(Math.abs(w), Math.abs(h)) / 2;
      const innerR = outerR * 0.42;
      const pts = 5;
      ctx.beginPath();
      for (let i = 0; i < pts * 2; i++) {
        const angle = (i * Math.PI / pts) - Math.PI / 2;
        const r2 = i % 2 === 0 ? outerR : innerR;
        const px = cx + Math.cos(angle) * r2;
        const py = cy + Math.sin(angle) * r2;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      if (s.fill.enabled) ctx.fill();
      ctx.stroke();
      break;
    }
    case 'line': {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y + h);
      ctx.stroke();
      break;
    }
    case 'arrow': {
      const ex = x + w, ey = y + h;
      const angle = Math.atan2(ey - y, ex - x);
      const ah = ARROW_HEAD / zoom;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - ah * Math.cos(angle - Math.PI/6), ey - ah * Math.sin(angle - Math.PI/6));
      ctx.lineTo(ex - ah * Math.cos(angle + Math.PI/6), ey - ah * Math.sin(angle + Math.PI/6));
      ctx.closePath();
      ctx.fillStyle = s.stroke.color;
      ctx.fill();
      break;
    }
    case 'text-only': {
      // standalone text, no shape
      break;
    }
  }

  // Draw text
  if (s.text && s.text.content && s.text.content.trim()) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = s.text.color || '#ffffff';
    ctx.font = `${s.text.size || 14}px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lines = s.text.content.split('\n');
    const lineH = (s.text.size || 14) * 1.3;
    const totalH = lines.length * lineH;
    const startY = cy - totalH / 2 + lineH / 2;
    lines.forEach((line, i) => {
      ctx.fillText(line, cx, startY + i * lineH, Math.abs(w) - 8);
    });
  }

  // Draw selection handles
  if (selected) {
    ctx.shadowBlur = 0;
    const handles = getHandles(s);
    ctx.strokeStyle = 'rgba(124,106,247,0.9)';
    ctx.lineWidth = 1.5 / zoom;
    ctx.setLineDash([4 / zoom, 3 / zoom]);

    if (s.type === 'line' || s.type === 'arrow') {
      ctx.beginPath();
      ctx.moveTo(x - 4/zoom, y - 4/zoom);
      ctx.lineTo(x + w + 4/zoom, y + h + 4/zoom);
      ctx.stroke();
    } else {
      ctx.strokeRect(x - 4/zoom, y - 4/zoom, w + 8/zoom, h + 8/zoom);
    }
    ctx.setLineDash([]);

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(124,106,247,0.9)';
    ctx.lineWidth = 1.5 / zoom;
    const hs = HANDLE_SIZE / zoom;
    handles.forEach(h2 => {
      ctx.beginPath();
      ctx.arc(h2.x, h2.y, hs / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });
  }

  ctx.restore();
}

function getHandles(s) {
  const { x, y, w, h } = s;
  if (s.type === 'line' || s.type === 'arrow') {
    return [
      { id: 'p1', x: x, y: y },
      { id: 'p2', x: x + w, y: y + h }
    ];
  }
  return [
    { id: 'tl', x: x, y: y }, { id: 'tc', x: x + w/2, y: y }, { id: 'tr', x: x+w, y: y },
    { id: 'ml', x: x, y: y + h/2 }, { id: 'mr', x: x+w, y: y + h/2 },
    { id: 'bl', x: x, y: y+h }, { id: 'bc', x: x+w/2, y: y+h }, { id: 'br', x: x+w, y: y+h }
  ];
}

function hitHandle(s, wx, wy) {
  const hs = (HANDLE_SIZE + 4) / zoom;
  for (const h of getHandles(s)) {
    if (Math.abs(wx - h.x) < hs && Math.abs(wy - h.y) < hs) return h.id;
  }
  return null;
}

// ═══════════════════════════════════════════════════════
// HIT TEST
// ═══════════════════════════════════════════════════════
function hitTest(s, wx, wy) {
  const { x, y, w, h } = s;
  if (s.type === 'line' || s.type === 'arrow') {
    // Line hit test: distance from point to segment
    const ex = x + w, ey = y + h;
    const d = distToSegment(wx, wy, x, y, ex, ey);
    return d < 8 / zoom;
  }
  return wx >= x && wx <= x + w && wy >= y && wy <= y + h;
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1;
  const lenSq = dx*dx + dy*dy;
  if (lenSq === 0) return Math.hypot(px-x1, py-y1);
  let t = ((px-x1)*dx + (py-y1)*dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t*dx), py - (y1 + t*dy));
}

function getShapeAt(wx, wy) {
  // Reverse order (top-most first)
  for (let i = shapes.length - 1; i >= 0; i--) {
    if (hitTest(shapes[i], wx, wy)) return shapes[i];
  }
  return null;
}

// ═══════════════════════════════════════════════════════
// TOOLS
// ═══════════════════════════════════════════════════════
function setTool(t) {
  currentTool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tool-' + t);
  if (el) el.classList.add('active');
  canvas.style.cursor = t === 'select' ? 'default' : 'crosshair';
  const names = { select:'Выбор', rect:'Прямоугольник', circle:'Круг', ellipse:'Овал',
    triangle:'Треугольник', diamond:'Ромб', star:'Звезда', line:'Линия', arrow:'Стрелка', text:'Текст' };
  document.getElementById('st-tool').textContent = 'Инструмент: ' + (names[t] || t);
}

// ═══════════════════════════════════════════════════════
// MOUSE EVENTS
// ═══════════════════════════════════════════════════════
canvas.addEventListener('mousedown', onMouseDown);
canvas.addEventListener('mousemove', onMouseMove);
canvas.addEventListener('mouseup', onMouseUp);
canvas.addEventListener('dblclick', onDblClick);
canvas.addEventListener('wheel', onWheel, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function onMouseDown(e) {
  const sp = getCanvasPos(e);
  const wp = screenToWorld(sp.x, sp.y);

  // Middle mouse or space+drag = pan
  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    isPanning = true;
    dragStart = sp;
    canvas.style.cursor = 'grab';
    return;
  }

  if (e.button !== 0) return;

  if (currentTool === 'select') {
    // Check resize handles first
    if (selectedId !== null) {
      const sel = shapes.find(s => s.id === selectedId);
      if (sel) {
        const h = hitHandle(sel, wp.x, wp.y);
        if (h) {
          resizeHandle = h;
          dragShapeStart = { ...sel };
          dragStart = sp;
          return;
        }
      }
    }
    // Check shape hit
    const hit = getShapeAt(wp.x, wp.y);
    if (hit) {
      selectShape(hit.id);
      isDragging = true;
      dragStart = wp;
      dragShapeStart = { x: hit.x, y: hit.y, w: hit.w, h: hit.h };
    } else {
      selectShape(null);
    }
  } else if (currentTool === 'text') {
    // Create text-only or add to existing
    const hit = getShapeAt(wp.x, wp.y);
    if (hit) {
      selectShape(hit.id);
      startTextEdit(hit);
    } else {
      startTextEdit(null, wp.x, wp.y);
    }
  } else {
    // Drawing
    isDrawing = true;
    drawStart = wp;
    currentShape = makeShape(currentTool, wp.x, wp.y, 0, 0);
  }
}

function onMouseMove(e) {
  const sp = getCanvasPos(e);
  const wp = screenToWorld(sp.x, sp.y);
  mousePos = wp;
  document.getElementById('st-mouse').textContent =
    `${Math.round(wp.x)}, ${Math.round(wp.y)}`;

  if (isPanning) {
    panX += sp.x - dragStart.x;
    panY += sp.y - dragStart.y;
    dragStart = sp;
    drawGrid();
    render();
    return;
  }

  if (resizeHandle) {
    applyResize(resizeHandle, wp);
    updatePropsPanel();
    render();
    return;
  }

  if (isDragging && selectedId !== null) {
    const sel = shapes.find(s => s.id === selectedId);
    if (sel) {
      sel.x = dragShapeStart.x + (wp.x - dragStart.x);
      sel.y = dragShapeStart.y + (wp.y - dragStart.y);
      updatePropsPanel();
      render();
    }
    return;
  }

  if (isDrawing) {
    let dx = wp.x - drawStart.x;
    let dy = wp.y - drawStart.y;
    if (e.shiftKey) {
      // Constrain aspect ratio
      if (currentTool === 'circle' || currentTool === 'rect') {
        const sz = Math.max(Math.abs(dx), Math.abs(dy));
        dx = dx < 0 ? -sz : sz;
        dy = dy < 0 ? -sz : sz;
      } else if (currentTool === 'line' || currentTool === 'arrow') {
        // Snap to 45deg
        const angle = Math.round(Math.atan2(dy, dx) / (Math.PI/4)) * (Math.PI/4);
        const len = Math.hypot(dx, dy);
        dx = Math.cos(angle) * len;
        dy = Math.sin(angle) * len;
      }
    }
    currentShape.w = dx;
    currentShape.h = dy;
    render();
    return;
  }

  // Update cursor for handles
  if (currentTool === 'select' && selectedId !== null) {
    const sel = shapes.find(s => s.id === selectedId);
    if (sel) {
      const h = hitHandle(sel, wp.x, wp.y);
      if (h) {
        const cursors = { tl:'nw-resize', tr:'ne-resize', bl:'sw-resize', br:'se-resize',
          tc:'n-resize', bc:'s-resize', ml:'w-resize', mr:'e-resize', p1:'move', p2:'move' };
        canvas.style.cursor = cursors[h] || 'pointer';
        return;
      }
    }
  }
  if (currentTool === 'select') {
    const hit = getShapeAt(wp.x, wp.y);
    canvas.style.cursor = hit ? 'move' : 'default';
  }
}

function onMouseUp(e) {
  if (isPanning) {
    isPanning = false;
    canvas.style.cursor = currentTool === 'select' ? 'default' : 'crosshair';
    return;
  }

  if (resizeHandle) {
    pushUndo();
    resizeHandle = null;
    dragShapeStart = null;
    return;
  }

  if (isDragging) {
    pushUndo();
    isDragging = false;
    dragShapeStart = null;
    return;
  }

  if (isDrawing && currentShape) {
    isDrawing = false;
    const minSize = 5 / zoom;
    if (Math.abs(currentShape.w) > minSize || Math.abs(currentShape.h) > minSize) {
      // Normalize negative dimensions
      if (currentShape.w < 0) { currentShape.x += currentShape.w; currentShape.w = -currentShape.w; }
      if (currentShape.h < 0) { currentShape.y += currentShape.h; currentShape.h = -currentShape.h; }
      if (currentShape.type === 'circle' || currentShape.type === 'star') {
        const sz = Math.min(currentShape.w, currentShape.h);
        currentShape.w = sz; currentShape.h = sz;
      }
      shapes.push(currentShape);
      selectShape(currentShape.id);
      pushUndo();
    }
    currentShape = null;
    render();
    // Switch to select after placing shape (except line/arrow)
    if (!['line', 'arrow'].includes(currentTool)) {
      setTool('select');
    }
  }
}

function onDblClick(e) {
  const sp = getCanvasPos(e);
  const wp = screenToWorld(sp.x, sp.y);
  const hit = getShapeAt(wp.x, wp.y);
  if (hit) {
    selectShape(hit.id);
    startTextEdit(hit);
  }
}

function applyResize(handle, wp) {
  const sel = shapes.find(s => s.id === selectedId);
  if (!sel || !dragShapeStart) return;
  const orig = dragShapeStart;

  if (sel.type === 'line' || sel.type === 'arrow') {
    if (handle === 'p1') { sel.x = wp.x; sel.y = wp.y; sel.w = (orig.x + orig.w) - wp.x; sel.h = (orig.y + orig.h) - wp.y; }
    if (handle === 'p2') { sel.w = wp.x - sel.x; sel.h = wp.y - sel.y; }
    return;
  }

  let nx = orig.x, ny = orig.y, nw = orig.w, nh = orig.h;
  if (handle.includes('l')) { nx = wp.x; nw = (orig.x + orig.w) - wp.x; }
  if (handle.includes('r')) { nw = wp.x - orig.x; }
  if (handle.includes('t')) { ny = wp.y; nh = (orig.y + orig.h) - wp.y; }
  if (handle.includes('b')) { nh = wp.y - orig.y; }

  if (nw > 5/zoom) { sel.x = nx; sel.w = nw; }
  if (nh > 5/zoom) { sel.y = ny; sel.h = nh; }
}

// ═══════════════════════════════════════════════════════
// ZOOM / PAN
// ═══════════════════════════════════════════════════════
function onWheel(e) {
  e.preventDefault();
  const sp = getCanvasPos(e);
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const newZoom = Math.min(10, Math.max(0.05, zoom * factor));
  panX = sp.x - (sp.x - panX) * (newZoom / zoom);
  panY = sp.y - (sp.y - panY) * (newZoom / zoom);
  zoom = newZoom;
  document.getElementById('tb-zoom').textContent = Math.round(zoom * 100) + '%';
  drawGrid();
  render();
}

function zoomIn() { applyZoom(1.2); }
function zoomOut() { applyZoom(0.8); }
function resetZoom() { zoom = 1; panX = 0; panY = 0; drawGrid(); render(); document.getElementById('tb-zoom').textContent = '100%'; }
function applyZoom(f) {
  const cx = canvas.width/2, cy = canvas.height/2;
  const newZoom = Math.min(10, Math.max(0.05, zoom * f));
  panX = cx - (cx - panX) * (newZoom / zoom);
  panY = cy - (cy - panY) * (newZoom / zoom);
  zoom = newZoom;
  document.getElementById('tb-zoom').textContent = Math.round(zoom * 100) + '%';
  drawGrid(); render();
}

// ═══════════════════════════════════════════════════════
// SELECTION
// ═══════════════════════════════════════════════════════
function selectShape(id) {
  selectedId = id;
  updatePropsPanel();
  render();
}

// ═══════════════════════════════════════════════════════
// TEXT EDITING
// ═══════════════════════════════════════════════════════
const textEditor = document.getElementById('text-editor');
let editingShapeId = null;

function startTextEdit(shape, wx, wy) {
  if (!shape) {
    // Create a rect with text
    const w = 120 / zoom, h = 40 / zoom;
    shape = makeShape('rect', wx - w/2, wy - h/2, w, h);
    shapes.push(shape);
    selectShape(shape.id);
    pushUndo();
  }
  editingShapeId = shape.id;
  const sp1 = worldToScreen(shape.x, shape.y);
  const sw = shape.w * zoom, sh = shape.h * zoom;

  textEditor.style.display = 'block';
  textEditor.style.left = sp1.x + 'px';
  textEditor.style.top = sp1.y + 'px';
  textEditor.style.width = Math.max(60, sw) + 'px';
  textEditor.style.height = Math.max(20, sh) + 'px';
  textEditor.style.fontSize = (shape.text.size || 14) * zoom + 'px';
  textEditor.style.color = shape.text.color || '#ffffff';
  textEditor.value = shape.text.content || '';
  textEditor.focus();
}

textEditor.addEventListener('input', () => {
  if (editingShapeId === null) return;
  const s = shapes.find(sh => sh.id === editingShapeId);
  if (s) { s.text.content = textEditor.value; render(); updatePropsPanel(); }
});

textEditor.addEventListener('blur', () => {
  textEditor.style.display = 'none';
  editingShapeId = null;
  pushUndo();
});

textEditor.addEventListener('keydown', e => {
  if (e.key === 'Escape') { textEditor.blur(); }
});

// ═══════════════════════════════════════════════════════
// PROPERTIES PANEL
// ═══════════════════════════════════════════════════════
function updatePropsPanel() {
  const noSel = document.getElementById('no-selection');
  const propsPanel = document.getElementById('props-panel');
  if (selectedId === null) {
    noSel.style.display = '';
    propsPanel.style.display = 'none';
    return;
  }
  const s = shapes.find(sh => sh.id === selectedId);
  if (!s) { noSel.style.display = ''; propsPanel.style.display = 'none'; return; }
  noSel.style.display = 'none';
  propsPanel.style.display = '';

  document.getElementById('prop-x').value = Math.round(s.x);
  document.getElementById('prop-y').value = Math.round(s.y);
  document.getElementById('prop-w').value = Math.round(s.w);
  document.getElementById('prop-h').value = Math.round(s.h);

  // Fill
  document.getElementById('fill-enabled').checked = s.fill.enabled;
  document.getElementById('fill-color').value = s.fill.color;
  document.getElementById('fill-swatch').style.background = s.fill.color;
  document.getElementById('fill-hex').value = s.fill.color;
  document.getElementById('fill-opacity').value = s.fill.opacity;
  document.getElementById('fill-opacity-val').textContent = s.fill.opacity;

  // Stroke
  document.getElementById('stroke-color').value = s.stroke.color;
  document.getElementById('stroke-swatch').style.background = s.stroke.color;
  document.getElementById('stroke-hex').value = s.stroke.color;
  document.querySelectorAll('.stroke-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.w) === s.stroke.width);
  });

  // Text
  document.getElementById('prop-text').value = s.text.content || '';
  document.getElementById('prop-fontsize').value = s.text.size || 14;
  document.getElementById('text-color').value = s.text.color || '#ffffff';

  // Hide fill for lines
  const isLine = s.type === 'line' || s.type === 'arrow';
  document.getElementById('fill-section').style.display = isLine ? 'none' : '';
}

function updatePropXY() {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.x = parseFloat(document.getElementById('prop-x').value) || 0;
  s.y = parseFloat(document.getElementById('prop-y').value) || 0;
  render();
}
function updatePropWH() {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.w = parseFloat(document.getElementById('prop-w').value) || 0;
  s.h = parseFloat(document.getElementById('prop-h').value) || 0;
  render();
}

function updateFill() {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.fill.enabled = document.getElementById('fill-enabled').checked;
  render();
}
function syncFillColor(v) {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.fill.color = v;
  document.getElementById('fill-swatch').style.background = v;
  document.getElementById('fill-hex').value = v;
  render();
}
function syncFillHex(v) {
  if (/^#[0-9a-fA-F]{6}$/.test(v)) {
    document.getElementById('fill-color').value = v;
    syncFillColor(v);
  }
}
function updateFillOpacity(v) {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.fill.opacity = parseInt(v);
  document.getElementById('fill-opacity-val').textContent = v;
  render();
}
function syncStrokeColor(v) {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.stroke.color = v;
  document.getElementById('stroke-swatch').style.background = v;
  document.getElementById('stroke-hex').value = v;
  render();
}
function syncStrokeHex(v) {
  if (/^#[0-9a-fA-F]{6}$/.test(v)) {
    document.getElementById('stroke-color').value = v;
    syncStrokeColor(v);
  }
}
function setStrokeWidth(w) {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.stroke.width = w;
  document.querySelectorAll('.stroke-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.w) === w);
  });
  render();
}
function updateText() {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.text.content = document.getElementById('prop-text').value;
  render();
}
function updateFontSize() {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.text.size = parseInt(document.getElementById('prop-fontsize').value) || 14;
  render();
}
function updateTextColor(v) {
  const s = shapes.find(sh => sh.id === selectedId); if (!s) return;
  s.text.color = v;
  render();
}

// ═══════════════════════════════════════════════════════
// DELETE
// ═══════════════════════════════════════════════════════
function deleteSelected() {
  if (selectedId === null) return;
  pushUndo();
  shapes = shapes.filter(s => s.id !== selectedId);
  selectShape(null);
  render();
}

// ═══════════════════════════════════════════════════════
// UNDO / REDO
// ═══════════════════════════════════════════════════════
function pushUndo() {
  undoStack.push(JSON.stringify(shapes));
  if (undoStack.length > 80) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(shapes));
  const state = undoStack.pop();
  shapes = JSON.parse(state);
  // Fix nextId
  shapes.forEach(s => { if (s.id >= nextId) nextId = s.id + 1; });
  selectShape(null);
  render();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(shapes));
  const state = redoStack.pop();
  shapes = JSON.parse(state);
  shapes.forEach(s => { if (s.id >= nextId) nextId = s.id + 1; });
  selectShape(null);
  render();
}

// ═══════════════════════════════════════════════════════
// PROJECT SAVE / LOAD
// ═══════════════════════════════════════════════════════
async function saveProject() {
  const data = { version: 1, shapes, nextId, zoom, panX, panY };
  const result = await window.electronAPI.saveProject(data);
  if (result.success) {
    showToast('Проект сохранён ✓');
  }
}

async function openProject() {
  const result = await window.electronAPI.openProject();
  if (result.success && result.data) {
    const d = result.data;
    shapes = d.shapes || [];
    nextId = d.nextId || 1;
    zoom = d.zoom || 1;
    panX = d.panX || 0;
    panY = d.panY || 0;
    document.getElementById('tb-zoom').textContent = Math.round(zoom * 100) + '%';
    selectShape(null);
    drawGrid();
    render();
    showToast('Проект загружен ✓');
  }
}

function newProject() {
  if (shapes.length > 0 && !confirm('Создать новый проект? Несохранённые изменения будут потеряны.')) return;
  shapes = [];
  nextId = 1;
  zoom = 1; panX = 0; panY = 0;
  undoStack = []; redoStack = [];
  selectShape(null);
  drawGrid(); render();
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:36px;left:50%;transform:translateX(-50%);' +
      'background:var(--surface3);border:1px solid var(--accent);color:var(--text);' +
      'font-family:JetBrains Mono,monospace;font-size:11px;padding:8px 16px;border-radius:8px;' +
      'z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.2s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2000);
}

// ═══════════════════════════════════════════════════════
// STATUS BAR
// ═══════════════════════════════════════════════════════
function updateStatusBar() {
  document.getElementById('st-objects').textContent = 'Объектов: ' + shapes.length;
}

// ═══════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z') { e.preventDefault(); undo(); }
    if (e.key === 'y') { e.preventDefault(); redo(); }
    if (e.key === 's') { e.preventDefault(); saveProject(); }
    if (e.key === 'o') { e.preventDefault(); openProject(); }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomIn(); }
    if (e.key === '-') { e.preventDefault(); zoomOut(); }
    return;
  }

  const map = { v:'select', r:'rect', c:'circle', e:'ellipse', t:'triangle',
    d:'diamond', s:'star', l:'line', a:'arrow', x:'text' };
  if (map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);

  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
  if (e.key === 'Escape') { selectShape(null); setTool('select'); }

  // Arrow keys move selected
  if (selectedId !== null && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    const s = shapes.find(sh => sh.id === selectedId);
    if (s) {
      const step = e.shiftKey ? 10 : 1;
      if (e.key === 'ArrowUp') s.y -= step;
      if (e.key === 'ArrowDown') s.y += step;
      if (e.key === 'ArrowLeft') s.x -= step;
      if (e.key === 'ArrowRight') s.x += step;
      updatePropsPanel();
      render();
      e.preventDefault();
    }
  }
});

// ═══════════════════════════════════════════════════════
// INITIAL STATE
// ═══════════════════════════════════════════════════════
pushUndo(); // empty state
render();
</script>
